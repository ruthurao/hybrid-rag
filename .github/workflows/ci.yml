name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Restore only. actions/cache saves in a post step that runs solely
      # on a green job, so a failing score never stored the weights.
      - name: Restore the embedding and reranking models
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-msmarco-minilm-nli-deberta-v3-small
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download models when the cache missed
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          python -c "from sentence_transformers import SentenceTransformer, CrossEncoder; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2'); CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2'); CrossEncoder('cross-encoder/nli-deberta-v3-small')"
      - name: Save the embedding and reranking models
        if: steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}
      - name: Harness tests
        run: pytest -q
      - name: Ingest into Chroma
        run: python scripts/ingest.py
      - name: Score the pipeline and fail when a rubric case misses
        run: python scripts/score_eval.py --output eval/record.json
      - name: Upload the eval record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-record
          path: eval/record.json
          if-no-files-found: ignore
